name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      # Production is MySQL, so CI is MySQL: SQLite would not catch a partial
      # index MySQL silently drops or a value it refuses at full length.
      db:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: schapp
          MYSQL_ROOT_PASSWORD: schapp
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pschapp"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-secret
      # root, because provisioning issues CREATE DATABASE for each tenant.
      DATABASE_URL: mysql://root:schapp@127.0.0.1:3306/schapp
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: black --check .
      - run: mypy apps config
        # Advisory. What is left is django-stubs / DRF-stubs friction — simplejwt
        # typed as `Token | None`, `Field.label` variance — not our own types.
        # Blocking the build on someone else's stubs is not a quality gate.
        continue-on-error: true
      - run: pytest --cov --cov-report=term-missing --cov-fail-under=80

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
